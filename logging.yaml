version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/application.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

  json_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/application.json
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

loggers:
  # Root logger
  root:
    level: INFO
    handlers: [console, file, error_file, json_file]

  # Application loggers
  src:
    level: DEBUG
    handlers: [console, file, json_file]
    propagate: false

  src.agents:
    level: INFO
    handlers: [file, json_file]
    propagate: false

  src.rag:
    level: INFO
    handlers: [file, json_file]
    propagate: false

  src.models:
    level: INFO
    handlers: [file, json_file]
    propagate: false

  # Third-party loggers (reduce noise)
  urllib3:
    level: WARNING
    handlers: [file]
    propagate: false

  openai:
    level: WARNING
    handlers: [file]
    propagate: false

  httpx:
    level: WARNING
    handlers: [file]
    propagate: false

  weaviate:
    level: INFO
    handlers: [file]
    propagate: false
